name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  unit:
    name: Unit tests (failure-mode fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy scipy pandas
      - run: bash tests/run_tests.sh

  pipeline:
    name: End to end, Nextflow ${{ matrix.nxf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, and whatever is current: 25.10 changed the
        # default parser, and both must keep working.
        nxf: ['24.10.0', 'latest-stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: nf-core/setup-nextflow@v2
        with: { version: '${{ matrix.nxf }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas

      # Build the image from this commit, so CI tests the container it ships.
      - name: Build container
        run: docker build -t aligninator:ci .
      - run: echo "process.container = 'aligninator:ci'" > ci.config

      - name: Lint (strict syntax)
        if: matrix.nxf == 'latest-stable'
        run: nextflow lint .

      - name: Run test profile
        run: nextflow run . -profile test,docker -c ci.config --outdir results
      - name: Assert results
        run: python tests/check_test_results.py results

      - name: Chemistry detection path (no --cb_len)
        run: |
          nextflow run . -profile test,docker -c ci.config --cb_len null --outdir detect
          grep -h VERDICT detect/barcode_structure/*.log
          test "$(grep -h 'cell barcode = 12 bp, UMI = 8 bp' detect/barcode_structure/*.log | wc -l)" -eq 2

      - name: Swapped reads must fail
        run: |
          printf 'sample,fastq_1,fastq_2\nmock,mock_R2.fastq.gz,mock_R1.fastq.gz\n' > tests/data/swapped.csv
          if nextflow run . -profile test,docker -c ci.config --input tests/data/swapped.csv --outdir swapped; then
            echo "swapped R1/R2 was accepted"; exit 1
          fi

      - name: Wrong viral contig name must fail validation
        run: |
          if nextflow run . -profile test,docker -c ci.config --viral_contig_rename 'X:Y' --outdir badref; then
            echo "unrenamed viral GTF was accepted"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-nxf-${{ matrix.nxf }}
          path: |
            results/summary.tsv
            results/pipeline_info/
            .nextflow.log

  publish:
    name: Publish container to GHCR
    needs: [unit, pipeline]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
